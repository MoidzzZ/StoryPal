<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="3040" viewBox="0 0 1720 3040" role="img" aria-labelledby="title desc">
  <title id="title">StoryPal：《流浪地球》连续共读系统架构与完善范围</title>
  <desc id="desc">自上而下分为场景与 Agent 主循环、上下文和记忆、StoryMem 数据与查询、代码落点和实施顺序。绿色表示已有实现，不代表陪读效果已验收；橙色表示本轮待新增或完善，灰色表示后续 TODO。C1 自动故事视图、C2 压缩后延续理解、C3 按证据缺口查证尚未完成。</desc>
