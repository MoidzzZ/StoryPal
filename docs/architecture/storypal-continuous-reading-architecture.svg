  <text x="1186" y="1883" class="heading orange">前文名称线索【待接入】</text>
  <text x="1186" y="1921" class="body">context_refs：304 项名称字符串</text>
  <text x="1186" y="1956" class="body">补 Evidence 元数据 → 名称导航／改写</text>
  <text x="1186" y="1991" class="small orange">不是 unit 引用边，不是关系／因果图</text>
