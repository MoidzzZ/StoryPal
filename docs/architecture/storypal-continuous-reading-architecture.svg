  <!-- 04: 代码落点，分层重构与验收 -->
  <rect x="32" y="2247" width="1656" height="692" rx="16" class="panel"/>
  <text x="56" y="2290" class="section">04 / 实现落点与交付顺序：增量改造，不重写 Agent 框架</text>
  <rect x="56" y="2325" width="500" height="235" rx="11" class="planned"/>
  <text x="78" y="2364" class="heading orange">StoryMem · 数据服务侧</text>
  <text x="78" y="2402" class="code">code/storymemory/adapter.py</text>
  <text x="78" y="2438" class="body">新增只读视图；补名称线索元数据</text>
  <text x="78" y="2474" class="body">源版本变化时失效旧 units 缓存</text>
  <text x="78" y="2510" class="small muted">不改旧方法返回契约；验证后独立提交</text>
  <text x="78" y="2540" class="small green">复用 storypipe 状态流与两种索引</text>
  <rect x="610" y="2325" width="500" height="235" rx="11" class="planned"/>
  <text x="632" y="2364" class="heading orange">StoryPal · 业务编排侧</text>
  <text x="632" y="2402" class="code">story_memory.py → reading_context.py</text>
  <text x="632" y="2438" class="body">服务校验＋预算投影【新增模块】</text>
  <text x="632" y="2474" class="code">tools.py：复用 provider／工具入口</text>
  <text x="632" y="2510" class="small muted">Skill：连续讨论／事实核验／手账回看</text>
  <text x="632" y="2540" class="small green">保留进度、Note、手账的存储与权限</text>
  <rect x="1164" y="2325" width="500" height="235" rx="11" class="planned"/>
  <text x="1186" y="2364" class="heading orange">nanobot · 两处小补丁</text>
  <text x="1186" y="2402" class="body">历史投影：只回放当前故事视图</text>
  <text x="1186" y="2438" class="body">归档：允许工作区覆盖压缩提示</text>
  <text x="1186" y="2474" class="code">runtime_context / memory.py</text>
  <text x="1186" y="2510" class="small muted">原始记录保留；缺覆盖仍用内置模板</text>
  <text x="1186" y="2540" class="small green">不改 Loop；沿用工具调用与压缩兜底</text>
  <rect x="56" y="2600" width="500" height="191" rx="11" class="planned"/>
  <text x="78" y="2638" class="heading orange">① C1：先交付安全当前视图</text>
  <text x="78" y="2676" class="body">接口 → 边界 → 投影 → 注入 → 去重</text>
  <text x="78" y="2712" class="small">测试：108 个边界／部分 unit／预算</text>
  <text x="78" y="2748" class="small">同进度多轮、换作品、源变化、重置</text>
  <text x="78" y="2778" class="small muted">无模型调用；不推进真实用户进度</text>
  <rect x="610" y="2600" width="500" height="191" rx="11" class="planned"/>
  <text x="632" y="2638" class="heading orange">② C2：压缩后接得上讨论</text>
  <text x="632" y="2676" class="body">工作区提示 → 压缩 → 摘要恢复</text>
  <text x="632" y="2712" class="small">测试：观点／修正／依据／疑问保持</text>
  <text x="632" y="2748" class="small">同会话重启；不自动写 Note／手账</text>
  <text x="632" y="2778" class="small muted">先做一条真实三轮链＋受控压缩</text>
  <rect x="1164" y="2600" width="500" height="191" rx="11" class="planned"/>
  <text x="1186" y="2638" class="heading orange">③ C3：功能与检索实验共用案例</text>
  <text x="1186" y="2676" class="body">原 query／Agent 改写；分词对照</text>
  <text x="1186" y="2712" class="small">FTS／jieba／BGE-M3；必要证据覆盖</text>
  <text x="1186" y="2748" class="small">分开评估召回、解释、调用与延迟</text>
  <text x="1186" y="2778" class="small muted">查数据：6 Luna；模拟用户：6 Sol</text>
