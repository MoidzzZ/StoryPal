  <path d="M 1110 1746 L 1164 1746" class="arrow"/>
  <rect x="56" y="1845" width="500" height="183" rx="11" class="existing"/>
  <text x="78" y="1883" class="heading">结构状态与历史查询【已有】</text>
  <text x="78" y="1921" class="body">108 快照；422 实体更新；96 情节线更新</text>
  <text x="78" y="1956" class="code">get_recap / get_entity_context</text>
