  <rect width="1720" height="3040" fill="#f7fafc"/>
  <text x="56" y="69" class="title">StoryPal · 连续共读系统架构</text>
  <text x="56" y="112" class="body muted">聚焦《流浪地球》：人物理解、事件因果、线索讨论，以及随着阅读推进修正自己的解读</text>
  <rect x="56" y="142" width="210" height="40" rx="8" class="existing"/>
  <text x="73" y="169" class="tag green">已有实现 · 实线</text>
  <rect x="292" y="142" width="295" height="40" rx="8" class="planned"/>
  <text x="309" y="169" class="tag orange">本轮待新增／完善 · 虚线</text>
  <rect x="613" y="142" width="260" height="40" rx="8" class="future"/>
  <text x="630" y="169" class="tag gray">后续 TODO · 点线</text>
  <text x="910" y="169" class="small muted">核对日期 2026-10-02｜已有模块 ≠ 理解质量已验收</text>

  <!-- 01: 场景与在线主循环 -->
  <rect x="32" y="210" width="1656" height="600" rx="16" class="panel"/>
  <text x="56" y="253" class="section">01 / 场景与在线 Agent：理解是目标，定位与检索是支撑</text>
  <text x="56" y="287" class="small muted">连续链：表达感受或困惑 → 形成暂定解释 → 读到新内容 → 补证据／修正解释；不要求每轮检索</text>
  <rect x="56" y="313" width="730" height="124" rx="12" class="existing"/>
  <text x="78" y="351" class="heading">桌面 WebUI · 阅读器</text>
  <text x="78" y="387" class="body">阅读原文／划选提问／段尾标记／本地续读</text>
  <text x="78" y="419" class="small muted">明确报告与确认才更新进度；滚动不开放未读证据</text>
  <rect x="908" y="313" width="756" height="124" rx="12" class="existing"/>
  <text x="930" y="351" class="heading">桌面 WebUI · 对话</text>
  <text x="930" y="387" class="body">用户原话、正在讨论的人物／问题、作品与阅读范围</text>
  <text x="930" y="419" class="small muted">目标：回应抓住点，区分事实、解释和用户观点</text>
  <path d="M 300 437 L 300 489" class="arrow"/>
  <text x="76" y="471" class="small muted">已确认进度＋已读片段</text>
  <path d="M 1100 437 L 1100 457 L 860 457 L 860 489" class="arrow"/>
  <text x="1202" y="471" class="small muted">原话与会话路由</text>
  <rect x="56" y="490" width="470" height="220" rx="12" class="existing"/>
  <text x="78" y="529" class="heading">上下文组装</text>
  <text x="78" y="567" class="body">人格、Note、近期对话、压缩摘要</text>
  <text x="78" y="603" class="body">阅读状态与当前单元已读前缀</text>
  <text x="78" y="639" class="small muted">复用 nanobot ContextBuilder</text>
  <rect x="75" y="658" width="427" height="36" rx="7" class="planned"/>
  <text x="89" y="683" class="tag orange">C1：待带入有预算的已读故事视图</text>
  <rect x="625" y="490" width="470" height="220" rx="12" class="existing"/>
  <text x="647" y="529" class="heading">主 Agent · nanobot Agent Loop</text>
  <text x="647" y="567" class="body">LLM → tool_calls → 执行 → 结果</text>
  <text x="647" y="603" class="body">继续推理或直接回复；最多 6 轮工具</text>
  <text x="647" y="639" class="small muted">沿用现有模型预设、会话与错误返回</text>
  <rect x="644" y="658" width="427" height="36" rx="7" class="planned"/>
  <text x="658" y="683" class="tag orange">C3：先用上下文，缺证据才调用工具</text>
  <rect x="1194" y="490" width="470" height="220" rx="12" class="existing"/>
  <text x="1216" y="529" class="heading">工具执行 · StoryPal 业务层</text>
  <text x="1216" y="567" class="body">定位与进度确认｜结构状态查询</text>
  <text x="1216" y="603" class="body">原文搜索／回取｜Note／手账</text>
  <text x="1216" y="639" class="small muted">服务端执行 owner 隔离与已读边界</text>
  <text x="1216" y="679" class="small green">已有工具复用，不重写注册／执行循环</text>
  <path d="M 526 584 L 625 584" class="arrow"/>
  <text x="535" y="567" class="small muted">上下文</text>
  <path d="M 1095 560 L 1194 560" class="arrow"/>
  <text x="1117" y="544" class="small muted">调用</text>
  <path d="M 1194 622 L 1095 622" class="arrow"/>
  <text x="1117" y="654" class="small muted">结果</text>
  <path d="M 860 710 L 860 742" class="arrow"/>
  <rect x="56" y="743" width="1608" height="46" rx="9" class="neutral"/>
  <text x="78" y="774" class="body">回复回到对话：承接你的观点 → 提供有依据的理解增量 → 保留尚未确定的问题（体验待验收）</text>

  <!-- 02: 上下文与记忆，C1/C2/C3 分工 -->
  <rect x="32" y="845" width="1656" height="720" rx="16" class="panel"/>
  <text x="56" y="888" class="section">02 / 上下文与记忆：故事已知状态 ≠ 我们的解读 ≠ 可回取的证据</text>
  <rect x="56" y="927" width="500" height="285" rx="12" class="planned"/>
  <text x="78" y="966" class="heading orange">C1 · 自动已读故事视图【新增】</text>
  <text x="78" y="1006" class="body">输入：作品＋完整已读 order</text>
  <text x="78" y="1041" class="body">来源：该边界最新 state_snapshot</text>
  <text x="78" y="1076" class="body">人物／物件／地点／情节线状态</text>
  <text x="78" y="1111" class="body">recent＋backdrop＋背景缓冲</text>
  <text x="78" y="1151" class="small orange">按预算投影，带来源；不调用 LLM</text>
  <text x="78" y="1184" class="small muted">不是全书总结，也不是新的记忆数据库</text>
  <rect x="610" y="927" width="500" height="285" rx="12" class="existing"/>
  <text x="632" y="966" class="heading">对话工作记忆【已有底座】</text>
  <text x="632" y="1006" class="body">近期消息＋工具结果＋会话 JSONL</text>
  <text x="632" y="1041" class="body">达到压缩条件 → 替换式摘要</text>
  <rect x="628" y="1061" width="464" height="133" rx="9" class="planned"/>
  <text x="644" y="1094" class="heading orange">C2 · 专门保留连续解读【完善】</text>
  <text x="644" y="1129" class="small">你的观点／暂定解释／修正／依据</text>
  <text x="644" y="1162" class="small">未解问题；与已有压缩共用一次调用</text>
  <rect x="1164" y="927" width="500" height="285" rx="12" class="existing"/>
  <text x="1186" y="966" class="heading">人格与交互约定【已有】</text>
  <text x="1186" y="1006" class="body">SOUL.md：身份与说话方式</text>
  <text x="1186" y="1041" class="body">AGENTS.md：工具、边界与产品规则</text>
  <text x="1186" y="1076" class="body">USER.md：确认的用户信息</text>
  <text x="1186" y="1111" class="body">每用户 Note.md：剧情外交互约定</text>
  <text x="1186" y="1151" class="small muted">Dream 仅允许整合 SOUL／USER</text>
  <text x="1186" y="1184" class="small orange">Note 临时项与开放观察维护仍待完善</text>
  <path d="M 306 1212 L 306 1250 L 860 1250 L 860 1291" class="plan-arrow"/>
  <path d="M 860 1212 L 860 1291" class="arrow"/>
  <path d="M 1414 1212 L 1414 1250 L 908 1250 L 908 1291" class="arrow"/>
  <text x="76" y="1280" class="small orange">自动常驻的是有界当前视图</text>
  <text x="1175" y="1280" class="small muted">不是每轮抽取，也不自动写手账</text>
  <rect x="56" y="1292" width="1608" height="131" rx="12" class="neutral"/>
  <text x="78" y="1330" class="heading">交给上层 Agent 的本轮上下文</text>
  <text x="78" y="1367" class="body">原话＋已读片段＋人格／Note＋近期对话／摘要＋按需回看的手账＋C1 故事视图</text>
  <text x="78" y="1403" class="small orange">待补：按 source 替换旧故事视图；历史原记录保留，其他上下文与工具结果不清空</text>
  <rect x="56" y="1450" width="500" height="85" rx="9" class="existing"/>
  <text x="78" y="1481" class="heading">用户阅读手账【已有独立存储】</text>
  <text x="78" y="1514" class="small">感受／疑问／预测；按需回看，明确要求才写</text>
  <rect x="610" y="1450" width="500" height="85" rx="9" class="existing"/>
  <text x="632" y="1481" class="heading">Policy／Provenance · 已有底座</text>
  <text x="632" y="1514" class="small">owner／边界／确认／unit／行号；视图待补</text>
  <path d="M 306 1450 L 306 1424" class="arrow"/>
  <rect x="1164" y="1450" width="500" height="85" rx="9" class="neutral"/>
  <text x="1186" y="1481" class="heading">Trace／诊断 · 不等于剧情记忆</text>
  <text x="1186" y="1514" class="small">已有调用记录；视图选择与坏例诊断待补</text>
  <text x="56" y="1558" class="small muted">用户持久化：进度 JSON／Note.md／手账 JSON／会话 JSONL＋摘要；旧 HistoryMemory 是 SQLite 显式存储。</text>

  <!-- 03: StoryMem 数据和已实现查询 -->
  <rect x="32" y="1605" width="1656" height="602" rx="16" class="panel"/>
  <text x="56" y="1648" class="section">03 / StoryMem：保留离线抽取与索引，用公开接口服务在线 Agent</text>
  <rect x="56" y="1686" width="500" height="119" rx="11" class="existing"/>
  <text x="78" y="1724" class="heading">原文 → 规范化 → 切分</text>
  <text x="78" y="1762" class="body">4 章／108 个 unit／原文行号映射</text>
  <text x="78" y="1791" class="small muted">00_raw → 01_normalized → 02_segmented</text>
  <rect x="610" y="1686" width="500" height="119" rx="11" class="existing"/>
  <text x="632" y="1724" class="heading">逐 unit 抽取 → 确定性合并</text>
  <text x="632" y="1762" class="body">LLM 产增量；state.py 顺序更新状态</text>
  <text x="632" y="1791" class="small muted">本轮不重新切分／抽取，不迁移数据库</text>
  <rect x="1164" y="1686" width="500" height="119" rx="11" class="existing"/>
  <text x="1186" y="1724" class="heading">JSONL 事实源 → 可重建索引</text>
  <text x="1186" y="1762" class="body">03_extracted/units_extracted.jsonl</text>
  <text x="1186" y="1791" class="small muted">索引只辅助召回，原文是事实核验依据</text>
