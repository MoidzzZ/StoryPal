name: storypal-chatbot
channels:
  - defaults
dependencies:
  - python=3.12
  - pip>=24
  - pip:
      - pytest>=9.0.0,<10.0.0
      - pytest-asyncio>=1.3.0,<2.0.0

# nanobot itself is intentionally not fetched from PyPI here. Build and install
# the fixed upstream commit with all patches under patches/nanobot applied to
# .runtime/nanobot/source-build, then install ./chatbot in editable mode.
# See docs/operations/WORK_COMPUTER_QUICKSTART.md.
